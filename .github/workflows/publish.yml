name: Publish to ClawHub

# Build the runtime output and publish to ClawHub on a version tag.
# Release flow: bump "version" in package.json and openclaw.plugin.json, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      # dist/ is gitignored; the npm `files` whitelist ships this fresh build. The OpenClaw CLI
      # bundles the Control UI view and writes its hashed entry into openclaw.plugin.json.
      - name: Build runtime output
        run: |
          npx esbuild src/index.ts --bundle --platform=node --format=esm --target=node22 \
            --outfile=dist/index.js --external:openclaw --external:'openclaw/*'
          OPENCLAW_STATE_DIR="$RUNNER_TEMP/openclaw" npx -y openclaw@latest plugins build

      - name: Install ClawHub CLI
        run: npm i -g clawhub

      - name: Authenticate
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN"

      # Publish the local folder (built dist included) with source provenance
      # linked back to this repo + commit.
      - name: Publish
        run: >-
          clawhub package publish .
          --source-repo ${{ github.repository }}
          --source-commit ${{ github.sha }}
          --wait
          --json
